# ============================================================
#  application.properties: configuración de la aplicación
# ============================================================

spring.application.name=biblioteca-api

# --- Servidor ---
server.port=8080

# --- Base de datos H2 (en memoria) ---
# "mem:" = en memoria; "bibliotecadb" es el nombre de la base de datos.
spring.datasource.url=jdbc:h2:mem:bibliotecadb
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
# create-drop: Hibernate CREA las tablas a partir de las entidades al arrancar
# y las BORRA al parar. Ideal para aprender; en producción NO se usa.
spring.jpa.hibernate.ddl-auto=create-drop
# Muestra en la consola las sentencias SQL que ejecuta Hibernate (muy útil para estudiar)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Desactivamos "open-in-view": las relaciones perezosas (LAZY) solo se pueden leer
# dentro de los métodos @Transactional del servicio. Es una buena práctica.
spring.jpa.open-in-view=false

# --- Consola web de H2 ---
# Abre http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:bibliotecadb  |  Usuario: sa  |  Contraseña: (vacía)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- springdoc-openapi ---
# JSON de la documentación:  http://localhost:8080/v3/api-docs
# Interfaz Swagger UI:       http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
